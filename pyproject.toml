[project]
name = "vae-topology-repro"
version = "0.1.0"
description = "Reproduction of 'Constructing VAE Latent Spaces with Prescribed Topology' (van Hulst et al., 2026), evaluated with persistent homology"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Jules Géraud Odjé" }]
dependencies = [
    # The authors' library and data generators, pinned to the exact commit we reproduce.
    "topovae @ git+https://github.com/JvHulst/VAE-Topology@08ed7cc694a8aecf08487a84ce54c52738488d66",
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "ripser>=0.6.8",
    "persim>=0.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaetopo"]

[tool.hatch.metadata]
allow-direct-references = true
